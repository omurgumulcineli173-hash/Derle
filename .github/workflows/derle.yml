name: derle
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Derleyici
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-i386
          wget -q https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar xzf pawnc-3.10.10-linux.tar.gz
          mkdir include
          git clone --depth 1 https://github.com/pawn-lang/pawn-stdlib std1
          git clone --depth 1 https://github.com/pawn-lang/samp-stdlib std2
          cp std1/*.inc include/
          cp std2/*.inc include/
          ls include
      - name: Derle
        run: |
          LIB=$(find $PWD/pawnc-3.10.10-linux -name libpawnc.so | head -1)
          export LD_LIBRARY_PATH=$(dirname $LIB)
          PAWNCC=$(find $PWD/pawnc-3.10.10-linux -name pawncc | head -1)
          $PAWNCC oyuncu.pwn -iinclude -Z -ooyuncu.amx
          $PAWNCC admin.pwn -iinclude -Z -oadmin.amx
      - uses: actions/upload-artifact@v4
        with:
          name: amx
          path: "*.amx"
